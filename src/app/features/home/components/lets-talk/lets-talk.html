<section class="py-12 md:py-20" id="lets-talk">
  <div class="container px-4 md:px-8 mx-auto">
    <!-- Main Dark Primary Card with Abstract Decorative Circles -->
    <div class="bg-primary text-white p-8 sm:p-12 md:p-16 relative overflow-hidden shadow-xl">

      <!-- Abstract Decorative Overlay Curves (Bottom Right) -->
      <div class="absolute -bottom-30 -right-30 w-96 h-96 rounded-full border-[30px] border-white/5 pointer-events-none"></div>
      <div class="absolute -bottom-15 -right-15 w-64 h-64 rounded-full border-[20px] border-white/5 pointer-events-none"></div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-end relative z-10">

        <!-- Left Column: Tagline & Main Heading (7 cols) -->
        <div class="lg:col-span-9 flex flex-col space-y-6">
          <span class="font-mono text-xs text-white/50 tracking-widest uppercase">
            07 / LET'S TALK
          </span>

          <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-[120px] font-semibold tracking-tight leading-[1.04]">
            <span class="block text-white">Have a messy product problem?</span>
            <span class="block font-serif italic font-normal text-[#C5A059] mt-2">
              Let's make it make sense.
            </span>
          </h2>
        </div>

        <!-- Right Column: Subtitle, Social Links & Download CV (5 cols) -->
        <div class="lg:col-span-3 flex flex-col space-y-8">

          <p class="text-sm sm:text-base text-white/80 font-normal leading-relaxed max-w-md">
            For product teams, founders, and curious people working on something worth making clearer.
          </p>

          <!-- Contact & Social Links Block -->
          <div class="flex flex-col space-y-6 pt-2">

            <!-- Links Row -->
            <div class="flex flex-wrap items-center gap-6 font-mono text-xs tracking-wider uppercase text-white/90">
              <!-- Email -->
              <a
                href="mailto:example@domain.com"
                class="inline-flex items-center gap-1.5 hover:text-[#C5A059] transition-colors cursor-pointer text-[16px]"
              >
                <span>Email</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
              </a>

              <!-- LinkedIn -->
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 hover:text-[#C5A059] transition-colors cursor-pointer text-[16px]"
              >
                <span>LinkedIn</span>
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.47 1.47 0 1 0 0 2.94 1.47 1.47 0 0 0 0-2.94Z"/>
                </svg>
              </a>

              <!-- Behance -->
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 hover:text-[#C5A059] transition-colors cursor-pointer text-[16px]"
              >
                <span>Behance</span>
                <span class="text-[10px]">↗</span>
              </a>
            </div>

            <!-- Download CV Line -->
            <div class="pt-2">
              <a
                href="#"
                download
                class="inline-flex items-center gap-2 font-mono text-xs tracking-wider text-[16px] uppercase text-white border-b border-white hover:text-[#C5A059] hover:border-[#C5A059] transition-colors cursor-pointer pb-1"
              >
                <span>Download CV</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                </svg>
              </a>
            </div>

          </div>

        </div>

      </div>

    </div>
  </div>
</section>
