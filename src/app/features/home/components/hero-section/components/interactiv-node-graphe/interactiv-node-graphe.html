 <div class="relative w-full  my-auto">
            <svg
              class="w-full h-auto relative"
              viewBox="0 0 400 300"
              fill="none"
              stroke="currentColor"
            >
              <!-- Connecting Lines -->

              <!-- USERS → GOALS → CONTEXT → FRICTION → DECISION -->
              <path
                d="M 55 75 L 145 150 L 210 65 L 300 135 L 355 235"
                stroke="#6b2c39"
                stroke-width="1"
                stroke-dasharray="2 2"
                opacity="0.6"
              />

              <!-- CONTEXT → CONSTRAINTS -->
              <path
                d="M 210 65 L 255 215"
                stroke="#6b2c39"
                stroke-width="1"
                stroke-dasharray="2 2"
                opacity="0.6"
              />

              <!-- ================= USERS ================= -->
              <circle
                cx="55"
                cy="75"
                r="4"
                [attr.fill]="resolve() ? '#C4944C' : 'var(--color-surface)'"
                [attr.stroke]="resolve() ? '#C4944C' : '#6b2c39'"
                stroke-width="2"
                style="transition: stroke 300ms ease"
              />

              <text x="67" y="70" font-family="monospace" font-size="10" fill="#666">USERS</text>

              <!-- ================= GOALS ================= -->
              <circle
                cx="145"
                cy="150"
                r="4"
                [attr.fill]="resolve() ? '#C4944C' : 'var(--color-surface)'"
                [attr.stroke]="resolve() ? '#C4944C' : '#6b2c39'"
                stroke-width="2"
                style="transition: stroke 300ms ease"
              />

              <text x="157" y="155" font-family="monospace" font-size="10" fill="#666">GOALS</text>

              <!-- ================= CONTEXT ================= -->
              <circle
                cx="210"
                cy="65"
                r="4"
                [attr.fill]="resolve() ? '#C4944C' : 'var(--color-surface)'"
                [attr.stroke]="resolve() ? '#C4944C' : '#6b2c39'"
                stroke-width="2"
                style="transition: stroke 300ms ease"
              />

              <text x="222" y="60" font-family="monospace" font-size="10" fill="#666">CONTEXT</text>

              <!-- ================= FRICTION ================= -->
              <circle
                cx="300"
                cy="135"
                r="4"
                [attr.fill]="resolve() ? '#C4944C' : 'var(--color-surface)'"
                [attr.stroke]="resolve() ? '#C4944C' : '#6b2c39'"
                stroke-width="2"
                style="transition: stroke 300ms ease"
              />

              <text x="312" y="130" font-family="monospace" font-size="10" fill="#666">
                FRICTION
              </text>

              <!-- ================= CONSTRAINTS ================= -->
              <circle
                cx="255"
                cy="215"
                r="4"
                [attr.fill]="resolve() ? '#C4944C' : 'var(--color-surface)'"
                [attr.stroke]="resolve() ? '#C4944C' : '#6b2c39'"
                stroke-width="2"
                style="transition: stroke 300ms ease"
              />

              <text x="267" y="210" font-family="monospace" font-size="10" fill="#666">
                CONSTRAINTS
              </text>

              <!-- ================= DECISION ================= -->
              <circle
                cx="355"
                cy="235"
                r="5"
                [attr.fill]="resolve() ? '#C4944C' : 'var(--color-surface)'"
                [attr.stroke]="resolve() ? '#C4944C' : '#6b2c39'"
                stroke-width="2"
                style="transition: stroke 300ms ease"
              />

              <text
                x="355"
                y="260"
                font-family="monospace"
                font-size="10"
                fill="#666"
                text-anchor="middle"
              >
                DECISION
              </text>
            </svg>
          </div>
