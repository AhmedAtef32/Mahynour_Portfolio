<div
            class="absolute left-1/2 -translate-x-1/2 -translate-y-1/2 w-[88%] z-10 flex flex-col gap-3 pointer-events-none transition-all duration-500 ease-in-out"
            [class]="{
              'opacity-100': resolve(),
              'top-[48%]': resolve(),
              'opacity-0': !resolve(),
              'top-[60%]': !resolve(),
            }"
          >
            <!-- Top Card -->
            <div
              class="w-full h-12 sm:h-18 bg-white/85 border border-[#e0ded6] p-3 flex items-center shadow-sm"
            >
              <div class="h-1.5 w-1/3 bg-[#6b2c39]/40 rounded-sm"></div>
            </div>

            <!-- Bottom Cards -->
            <div class="grid grid-cols-12 gap-2 sm:gap-3 w-full h-32 sm:h-44">
              <!-- Goals -->
              <div
                class="col-span-5 h-full bg-white/85 border border-[#e0ded6] p-3 sm:p-4 flex flex-col justify-between shadow-sm"
              >
                <div class="w-3/4 h-px bg-[#c8c5bb]"></div>
                <div class="w-1/2 h-px bg-[#c8c5bb]"></div>
                <div class="w-2/3 h-px bg-[#c8c5bb]"></div>
              </div>

              <!-- Decision -->
              <div
                class="col-span-7 h-full bg-white/85 border border-[#e0ded6] p-3 sm:p-4 flex items-start justify-center shadow-sm"
              >
                <div class="h-4 sm:h-5 w-5/6 bg-[#6b2c39]/50 rounded-sm"></div>
              </div>
            </div>
          </div>
